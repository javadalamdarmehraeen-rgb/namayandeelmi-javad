# ============================================================
#  GitLab CI — همان جریان GitHub برای هاست داخلی NdcoHub
# ============================================================
stages: [build, mirror, deploy, sync]

default:
  image: node:20
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths: [.npm/, node_modules/]

variables:
  NEXT_PUBLIC_ENDPOINTS: "https://ndcohub.ir,https://namayandeelmi-javad.onrender.com"
  GIT_DEPTH: "0"

build:
  stage: build
  script:
    - npm ci --include=dev --cache .npm --prefer-offline
    - npx next typegen
    - npx tsc --noEmit
    - npm run build
  artifacts:
    expire_in: 1 day
    paths: [.next/, public/]

mirror-to-github:
  stage: mirror
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
  script:
    - |
      if [ -z "$GITHUB_REPO_URL" ]; then echo "GITHUB_REPO_URL تنظیم نشده — رد شد"; exit 0; fi
      AUTH_URL=$(echo "$GITHUB_REPO_URL" | sed "s#https://#https://x-access-token:${GITHUB_TOKEN}@#")
      git remote add github "$AUTH_URL" || git remote set-url github "$AUTH_URL"
      git push github HEAD:$CI_COMMIT_BRANCH --force
      git push github --tags --force

deploy:
  stage: deploy
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
  script:
    - '[ -n "$NDCOHUB_DEPLOY_HOOK" ] && curl -fsSL -X POST "$NDCOHUB_DEPLOY_HOOK" && echo "✔ NdcoHub" || echo "hook تنظیم نشده"'
    - '[ -n "$RENDER_DEPLOY_HOOK" ] && curl -fsSL -X POST "$RENDER_DEPLOY_HOOK" && echo "✔ Render" || true'

sync-after-deploy:
  stage: sync
  needs: [deploy]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
  script:
    - |
      if [ -z "$SYNC_SECRET" ]; then echo "SYNC_SECRET تنظیم نشده"; exit 0; fi
      sleep 90
      curl -fsSL -X POST "https://ndcohub.ir/api/sync/run" -H "x-sync-key: $SYNC_SECRET" || true
      curl -fsSL -X POST "https://namayandeelmi-javad.onrender.com/api/sync/run" -H "x-sync-key: $SYNC_SECRET" || true
