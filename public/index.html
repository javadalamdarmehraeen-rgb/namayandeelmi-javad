<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d9488" />
  <title>سامانه مدیریت نمایندگان علمی</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d9488'/%3E%3Cg transform='rotate(45 32 32)'%3E%3Crect x='18' y='24' width='28' height='16' rx='8' fill='white'/%3E%3Crect x='24' y='29' width='4' height='6' fill='%230d9488'/%3E%3Crect x='36' y='29' width='4' height='6' fill='%230d9488'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css?v=9.0.0" />
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <div class="logo-area">
        <button id="btnToggleSideMenu" class="btn-menu-hamburger" title="منو">☰</button>
        <div class="logo-icon">💊</div>
        <div class="logo-text"><h1>سامانه نمایندگان علمی</h1><p>داروخانه، پزشک، سفارش، نقشه و رصد</p></div>
      </div>
      <div class="header-actions">
        <span class="badge-status-online" id="globalOnlineStatusBadge">آنلاین</span>
        <button id="btnOpenLoginModal" class="btn-header-teal">ورود کاربر</button>
      </div>
    </div>
  </header>

  <nav class="app-nav"><div class="nav-container" id="horizontalNavContainer"></div></nav>
  <aside id="sideMenuDrawer" class="side-menu-drawer"><div class="side-menu-header"><b>منوی دسترسی</b><button id="btnCloseSideMenu" class="btn-close-side">×</button></div><div class="side-menu-content" id="sideMenuItemsContainer"></div></aside>
  <div id="sideMenuOverlay" class="side-menu-overlay"></div>

  <main class="main-content" id="app"></main>

  <div id="modalLogin" class="modal-overlay">
    <div class="modal-content">
      <div class="card-header"><div class="card-title">ورود به سامانه</div></div>
      <p style="color:#64748b">برای نمایش نسخه نمایشی، کاربر «مدیر سیستم» را انتخاب کنید.</p>
      <div class="form-grid" id="loginUsers"></div>
      <button class="btn btn-outline" onclick="App.closeLogin()">بستن</button>
    </div>
  </div>
  <div id="modalDetails" class="modal-overlay"><div class="modal-content" id="modalDetailsContent"></div></div>
  <div id="toast" class="toast" style="display:none"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="crm-app.js?v=9.0.0"></script>
</body>
</html>
